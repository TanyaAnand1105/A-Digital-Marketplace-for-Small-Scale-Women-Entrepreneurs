<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Add Product</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
href="/static/css/style.css">

</head>

<body class="dashboard-body">

<!-- ================= SIDEBAR ================= -->

<div class="sidebar">

    <div>

        <h1 class="logo">
            KalaKriti
        </h1>

        <p class="tagline">
            Empowering Women Artisans ✨
        </p>

        <div class="sidebar-menu">

            <div class="menu-item" 
            onclick="window.location.href='/seller_dashboard'">

                <i class="fa-solid fa-chart-line"></i>

                <span>Dashboard</span>

            </div>

            <div class="menu-item active"
            onclick="window.location.href='/add_product'">

                <i class="fa-solid fa-plus"></i>

                <span>Add Product</span>

            </div>

            <div class="menu-item"
 onclick="window.location.href='/manage_products'">
                <i class="fa-solid fa-box"></i>

                <span>Manage Products</span>

            </div>

            <div class="menu-item"
 onclick="window.location.href='/orders'">
                <i class="fa-solid fa-cart-shopping"></i>

                <span>Orders</span>

            </div>

            <div class="menu-item"
 onclick="window.location.href='/wishlist'">
                <i class="fa-solid fa-heart"></i>

                <span>Wishlist</span>

            </div>

            <div class="menu-item"
 onclick="window.location.href='/profile'">

                <i class="fa-solid fa-user"></i>

                <span>Profile</span>

            </div>

            <div class="menu-item"
             onclick="window.location.href='/login'">
                <i class="fa-solid fa-right-from-bracket"></i>

                <span>Logout</span>

            </div>

        </div>

    </div>

    <!-- BOTTOM CARD -->

    <div class="sidebar-bottom">

        <h3>
            Grow Your Store 🚀
        </h3>

        <p>
            Reach more buyers and boost your sales.
        </p>

        <button>
            Explore
        </button>

    </div>

</div>
<!-- ================= MAIN CONTENT ================= -->

<div class="main-content">

    <!-- TOPBAR -->

    <div class="topbar">

        <div>

            <h1>
                Add New Product ✨
            </h1>

            <p>
                Upload and manage your handmade creations
            </p>

        </div>

        <div class="profile-box">

            <img
            src="../static/images/profile.jpg.jpeg">

            <div>

                <h4 id="sellerName">
                    Seller
                </h4>

                <p>
                    Artisan Seller
                </p>

            </div>

        </div>

    </div>

    <!-- FORM CARD -->

    <div class="add-product-card">

        <form
        action="/add_product"
        method="POST"
        enctype="multipart/form-data"
        class="product-form">

            <!-- PRODUCT NAME -->

            <div class="form-group">

                <label>
                    Product Name
                </label>

                <input
                type="text"
                name="title"
                placeholder="Enter product name"
                required>

            </div>

            <!-- PRICE -->

            <div class="form-group">

                <label>
                    Product Price
                </label>

                <input
                type="number"
                name="price"
                placeholder="Enter product price"
                required>

            </div>

            <!-- CATEGORY -->

            <div class="form-group">

                <label>
                    Product Category
                </label>

                <select
                name="category"
                required>

                    <option value="">
                        Select Category
                    </option>

                    <option>
                        Handmade
                    </option>

                    <option>
                        Decor
                    </option>

                    <option>
                        Craft
                    </option>

                    <option>
                        Art
                    </option>

                </select>

            </div>

            <!-- DESCRIPTION -->

            <div class="form-group">

                <label>
                    Product Description
                </label>

                <textarea
                name="description"
                rows="6"
                placeholder="Write product details..."
                required></textarea>

            </div>

            <!-- IMAGE -->

            <div class="form-group">

                <label>
                    Upload Product Image
                </label>

                <input
                type="file"
                name="image"
                accept="image/*"
                required>

            </div>

            <!-- BUTTON -->

            <button
            type="submit"
            class="publish-btn">

                <i class="fa-solid fa-cloud-arrow-up"></i>

                Publish Product

            </button>

        </form>

    </div>

</div>

<!-- NAME SCRIPT -->

<script>

const sellerName =
localStorage.getItem("userName");

if(sellerName){

    document.getElementById(
        "sellerName"
    ).innerText = sellerName;
}

</script>

</body>
</html>
