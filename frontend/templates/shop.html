<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shop</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>

<body class="shop-page">

<header class="shop-navbar">

    <a href="/dashboard" class="back-btn">⬅</a>
    <h1 class="logo">Handmade Market</h1>

    <div class="search-box">
        <input type="text" placeholder="Search handmade products...">
        <button>🔍</button>
    </div>

    <div class="nav-icons">

        <a href="login.html" class="icon-box">
            <span class="icon">😊</span>
            <span>Account</span>
        </a>

        <a href="/wishlist" class="icon-box">
            <span class="icon">❤</span>
            <span>Wishlist</span>
        </a>

        <a href="/cart" class="icon-box">
            <span class="icon">🛒</span>
            <span>Cart</span>
        </a>

    </div>

</header>

<!-- CATEGORY SECTION -->
<section class="categories">

    <div class="category">
        <img src="../static/images/Bags.jpeg"><p>Bags</p>
    </div>

    <div class="category">
        <img src="../static/images/Jewellery.jpeg"><p>Jewellery</p>
    </div>

    <div class="category">
        <img src="../static/images/Clothes.jpeg"><p>Clothes</p>
    </div>

    <div class="category">
        <img src="../static/images/Candles.jpeg"><p>Candles</p>
    </div>

    <div class="category">
        <img src="../static/images/Crochet.jpeg"><p>Flowers</p>
    </div>

</section>

<!-- ================= DEALS OF THE DAY ================= -->

<h2 class="section-title">
    Deals of the Day
</h2>

<section class="deals-row">

    <!-- PURSE -->

    <div class="product-card">

        <a href="/product">

            <img src="/static/images/crochet purse.jpeg">

        </a>

        <h3>Purse</h3>

        <p>₹1200</p>

        <button onclick="addToCart()">
            Add to Cart
        </button>

    </div>

    <!-- SAREE -->

    <div class="product-card">

        <a href="/product">

            <img src="/static/images/Madhubani Sarees.jpeg">

        </a>

        <h3>Madhubani Saree</h3>

        <p>₹2000</p>

        <button onclick="addToCart()">
            Add to Cart
        </button>

    </div>

    <!-- BEDSHEET -->

    <div class="product-card">

        <a href="/product">

            <img src="/static/images/Bedsheet.jpeg">

        </a>

        <h3>Applique Bedsheet</h3>

        <p>₹1800</p>

        <button onclick="addToCart()">
            Add to Cart
        </button>

    </div>

    <!-- VASE -->

    <div class="product-card">

        <a href="/product">

            <img src="/static/images/Clay vase.jpeg">

        </a>

        <h3>Clay Vase</h3>

        <p>₹749</p>

        <button onclick="addToCart()">
            Add to Cart
        </button>

    </div>

</section>
<!-- PROMO -->
<section class="promo">

    <a href="shop.html" class="promo-card">
        <img src="../static/images/Crochet Toys.jpeg">
        <h3>Crochet Toys</h3>
        <p>Up to 60% Off</p>
    </a>

    <a href="shop.html" class="promo-card">
        <img src="../static/images/Handmade Baskets.jpeg">
        <h3>Handmade Baskets</h3>
        <p>Up to 70% Off</p>
    </a>

    <a href="shop.html" class="promo-card">
        <img src="../static/images/Home Decor.jpeg">
        <h3>Home Decor</h3>
        <p>Up to 45% Off</p>
    </a>

</section>

</body>
</html>
