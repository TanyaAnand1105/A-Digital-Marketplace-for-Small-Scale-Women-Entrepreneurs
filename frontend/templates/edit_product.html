<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>
Edit Product
</title>

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<link rel="stylesheet"
href="/static/css/style.css">

</head>

<body class="dashboard-body">

<!-- SIDEBAR -->


<div class="sidebar">

    <div>

        <h1 class="logo">
            KalaKriti
        </h1>

        <p class="tagline">
            Empowering Women Artisans ✨
        </p>

        <div class="sidebar-menu">

            <div class="menu-item" 
            onclick="window.location.href='/seller_dashboard'">

                <i class="fa-solid fa-chart-line"></i>

                <span>Dashboard</span>

            </div>

            <div class="menu-item"
            onclick="window.location.href='/add_product'">

                <i class="fa-solid fa-plus"></i>

                <span>Add Product</span>

            </div>

            <div class="menu-item active"
            onclick="window.location.href='/manage_products'">
                <i class="fa-solid fa-box"></i>

                <span>Manage Products</span>

            </div>

            <div class="menu-item"
 onclick="window.location.href='/orders'">
                <i class="fa-solid fa-cart-shopping"></i>

                <span>Orders</span>

            </div>

            <div class="menu-item"
 onclick="window.location.href='/wishlist'">
                <i class="fa-solid fa-heart"></i>

                <span>Wishlist</span>

            </div>

            <div class="menu-item"
 onclick="window.location.href='/profile'">

                <i class="fa-solid fa-user"></i>

                <span>Profile</span>

            </div>

            <div class="menu-item"
             onclick="window.location.href='/login'">
                <i class="fa-solid fa-right-from-bracket"></i>

 
                <span>Logout</span>

            </div>

        </div>

    </div>

    <!-- BOTTOM CARD -->

    <div class="sidebar-bottom">

        <h3>
            Grow Your Store 🚀
        </h3>

        <p>
            Reach more buyers and boost your sales.
        </p>

        <button>
            Explore
        </button>

    </div>

</div>

<!-- MAIN -->

<div class="main-content">

    <div class="topbar">

        <div>

            <h1>
                Edit Product ✏️
            </h1>

            <p>
                Update your product details
            </p>

        </div>

    </div>

    <!-- FORM -->

    <div class="edit-product-card">

        <form
        id="editForm"
        class="edit-product-form">

            <input
            type="text"
            id="editTitle"
            placeholder="Product title">

            <input
            type="number"
            id="editPrice"
            placeholder="Product price">

            <input
            type="text"
            id="editCategory"
            placeholder="Category">

            <textarea
            id="editDescription"
            placeholder="Description"></textarea>

            <button type="submit">

                Update Product 🚀

            </button>

        </form>

    </div>

</div>

<script src="/static/js/script.js"></script>

</body>
</html>
