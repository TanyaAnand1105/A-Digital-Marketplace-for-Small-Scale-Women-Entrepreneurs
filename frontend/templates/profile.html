<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        Profile
    </title>

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

    <link rel="stylesheet" href="/static/css/style.css">

</head>

<body class="dashboard-body">

    <!-- SIDEBAR -->


    <div class="sidebar">

        <div>

            <h1 class="logo">
                KalaKriti
            </h1>

            <p class="tagline">
                Empowering Women Artisans ✨
            </p>

            <div class="sidebar-menu">

                <div class="menu-item" onclick="window.location.href='/seller_dashboard'">

                    <i class="fa-solid fa-chart-line"></i>

                    <span>Dashboard</span>

                </div>

                <div class="menu-item" onclick="window.location.href='/add_product'">

                    <i class="fa-solid fa-plus"></i>

                    <span>Add Product</span>

                </div>

                <div class="menu-item active" onclick="window.location.href='/manage_products'">
                    <i class="fa-solid fa-box"></i>

                    <span>Manage Products</span>

                </div>

                <div class="menu-item" onclick="window.location.href='/orders'">
                    <i class="fa-solid fa-cart-shopping"></i>

                    <span>Orders</span>

                </div>

                <div class="menu-item" onclick="window.location.href='/wishlist'">
                    <i class="fa-solid fa-heart"></i>

                    <span>Wishlist</span>

                </div>

                <div class="menu-item" onclick="window.location.href='/profile'">

                    <i class="fa-solid fa-user"></i>

                    <span>Profile</span>

                </div>

                <div class="menu-item" onclick="window.location.href='/login'">
                    <i class="fa-solid fa-right-from-bracket"></i>


                    <span>Logout</span>

                </div>

            </div>

        </div>

        <!-- BOTTOM CARD -->

        <div class="sidebar-bottom">

            <h3>
                Grow Your Store 🚀
            </h3>

            <p>
                Reach more buyers and boost your sales.
            </p>

            <button>
                Explore
            </button>

        </div>

    </div>

    <!-- MAIN -->

    <div class="main-content">

        <!-- TOPBAR -->

        <div class="topbar">

            <div>

                <h1>
                    My Profile 👩‍🎨
                </h1>

                <p>
                    Manage your personal details
                </p>

            </div>

        </div>

        <!-- PROFILE CARD -->

        <div class="profile-card">

            <!-- LEFT -->

            <div class="profile-left">

                <!-- MAIN IMAGE -->

                <img id="profilePreview" src="../static/images/profile.jpg.jpeg" class="profile-image">

                <!-- UPLOAD -->

                <input type="file" id="profileUpload" accept="image/*">

                <!-- DEFAULT AVATARS -->

                <div class="avatar-grid">

                    <img src="../static/images/avatar1.jpeg" onclick="setAvatar(this.src)">

                    <img src="../static/images/avatar2.jpeg" onclick="setAvatar(this.src)">

                    <img src="../static/images/avatar10.jpeg" onclick="setAvatar(this.src)">

                    <img src="../static/images/avatar11.jpeg" onclick="setAvatar(this.src)">

                    <img src="../static/images/avatar8.jpeg" onclick="setAvatar(this.src)">

                    <img src="../static/images/avatar9.jpeg" onclick="setAvatar(this.src)">

                </div>

            </div>

            <!-- RIGHT -->

            <div class="profile-right">

                <form id="profileForm">

                    <div class="profile-group">

                        <label>
                            Full Name
                        </label>

                        <input type="text" id="profileName" placeholder="Your name">

                    </div>

                    <div class="profile-group">

                        <label>
                            Email
                        </label>

                        <input type="email" id="profileEmail" placeholder="Your email">

                    </div>

                    <div class="profile-group">

                        <label>
                            Phone
                        </label>

                        <input type="text" id="profilePhone" placeholder="Phone number">

                    </div>

                    <div class="profile-group">

                        <label>
                            Location
                        </label>

                        <input type="text" id="profileLocation" placeholder="Your city">

                    </div>

                    <div class="profile-group">

                        <label>
                            About
                        </label>

                        <textarea id="profileAbout" placeholder="Tell about yourself">
                    </textarea>

                    </div>

                    <button type="submit">

                        Save Profile 🚀

                    </button>

                </form>

            </div>

        </div>

    </div>

    <script src="/static/js/profile.js"></script>

</body>

</html>
