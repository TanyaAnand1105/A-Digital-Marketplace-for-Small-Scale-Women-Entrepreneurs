<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">
<title>Signup</title>

<link rel="stylesheet" href="/static/css/style.css">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

<script defer src="/static/js/script.js"></script>
</head>

<!-- ❌ FIXED: removed duplicate body -->
<body class="auth-body">

<div class="container">

  <!-- LEFT -->
  <div class="left">

    <div class="circle"></div>

    <img src="/static/images/login-art.png" class="avatar">

    <h2>KalaKriti</h2>

    <p>
      Empowering women artisans.
      <br>
      Discover handcrafted treasures.
    </p>

    <span>Already have an account?</span>

    <button class="outline-btn"
      onclick="window.location.href='/login'">
      Login →
    </button>

    <div class="stats">
      <div>
        <h3>500+</h3>
        <p>Artisans</p>
      </div>

      <div>
        <h3>10K+</h3>
        <p>Products</p>
      </div>

      <div>
        <h3>50K+</h3>
        <p>Customers</p>
      </div>
    </div>

  </div>

  <!-- RIGHT -->
  <div class="right">

    <h2>Create Account</h2>

    <p class="sub">
      Join our community of artisans and buyers
    </p>

    <!-- ✅ FORM ADDED -->
    <form id="signupForm" action="/signup" method="post">

      <!-- NAME -->
      <label>Full Name</label>

      <div class="input-box">
        <i class="fa-solid fa-user"></i>

        <input
          type="text"
          name="name"
          id="name"
          placeholder="Your full name"
        required>
      </div>

      <span class="error" id="nameError"></span>
      <!-- EMAIL -->
      <label>Email Address</label>

      <div class="input-box">
        <i class="fa-solid fa-envelope"></i>

        <input
          type="email"
          name="email"
          id="email"
          placeholder="your@email.com"
        required>
      </div>

     <span class="error" id="emailError"></span>

      <!-- PASSWORD -->
      <label>Password</label>

      <div class="input-box pass-box">

        <i class="fa-solid fa-lock"></i>

        <input
          type="password"
          name="password"
          id="password"
          placeholder="Min. 6 characters"
        required>

        <i class="fa-solid fa-eye eye"
           data-id="password"></i>

      </div>

      <span class="error" id="passError"></span>
      <!-- CONFIRM -->
      <label>Confirm Password</label>

      <div class="input-box pass-box">

        <i class="fa-solid fa-lock"></i>

        <input
    type="password"
    name="confirmPassword"
    id="confirmPassword"
    placeholder="Confirm Password"
    required>

        <i class="fa-solid fa-eye eye"
           data-id="confirmPassword"></i>

      </div>

      <p id="passwordError"></p>

      <span class="error" id="confirmError"></span>

      <!-- ROLE -->
      <label>I want to</label>

      <div class="roles">

        <div class="role" data-role="buyer">
          🛍 Buy Products
        </div>

        <div class="role" data-role="seller">
          🏪 Sell Products
        </div>

      </div>

      <input
  type="hidden"
  name="role"
  id="selectedRole">

      <!-- BUTTON -->
      <button id="signupBtn" type="submit">
        Create Account 🎉
      </button>

    </form>

   <p class="bottom">

  Already have an account?

  <button class="login-link-btn"
    onclick="window.location.href='/login'">

    Login here

  </button>

</p>

  </div>

</div>
  

<script>
  document
  .getElementById("signupForm")
  .addEventListener("submit", function(e){
    localStorage.setItem(
   "userName",
   document.getElementById("name").value
);
const role =
document.getElementById("selectedRole").value;

if(role === ""){

    e.preventDefault();

    alert("Please select Buyer or Seller 😭");

    return;
}

    const password =
    document.getElementById("password").value;

    const confirmPassword =
    document.getElementById("confirmPassword").value;

    const error =
    document.getElementById("passwordError");

    if(password !== confirmPassword){

        e.preventDefault();

        error.innerText =
        "Passwords do not match 😭";

        error.style.color = "red";

        error.style.marginTop = "8px";

        error.style.fontWeight = "600";

    }

});

const roles = document.querySelectorAll(".role");

const selectedRole =
document.getElementById("selectedRole");

roles.forEach(role => {

    role.addEventListener("click", () => {

        roles.forEach(r => {
            r.classList.remove("active");
        });

        role.classList.add("active");

        selectedRole.value =
        role.dataset.role;

        console.log(selectedRole.value);

    });

});

</script>

</body>
</html>
